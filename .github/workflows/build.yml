name: MoviePilot Builder v2
on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'disable docker cache'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main
    paths:
      - 'version.py'

jobs:
  Docker-build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        id: release_version
        run: |
          app_version=$(cat version.py |sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=$app_version" >> $GITHUB_ENV

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=latest

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Login DockerHub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event.inputs.no_cache != 'true' && 'type=gha, scope=${{ github.workflow }}-docker' || '' }}
          cache-to: ${{ github.event.inputs.no_cache != 'true' && 'type=gha, scope=${{ github.workflow }}-docker' || '' }}

      - name: Delete Release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        continue-on-error: true
        with:
          tag_name: v${{ env.app_version }}
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 v${{ env.app_version }}^ 2>/dev/null || echo "")
          
          if [ -n "$prev_tag" ]; then
            commits=$(git log "$prev_tag..v${{ env.app_version }}" --format="* %s in %h" --reverse)
          else
            commits=$(git log "v${{ env.app_version }}" --format="* %s in %h" --reverse)
          fi
          
          # 过滤 merge commits
          commits=$(echo "$commits" | grep -v "^* Merge" || echo "")
          
          # 构建 notes（使用 \r\n 换行符适配前端）
          notes="## What's Changed"
          if [ -n "$commits" ]; then
            notes+=$'\r\n'
            notes+="$commits"
          fi
          notes+=$'\r\n'
          notes+=$'\r\n'
          if [ -n "$prev_tag" ]; then
            notes+="**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prev_tag...v${{ env.app_version }}"
          fi
          
          # 保存到环境变量
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$notes" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.app_version }}
          name: v${{ env.app_version }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
